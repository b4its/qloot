name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: qloot_test
          POSTGRES_USER: qloot
          POSTGRES_PASSWORD: change-me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qloot" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://qloot:change-me@localhost:5432/qloot_test
      AI_PROVIDER: mock
      BLOCKCHAIN_DRY_RUN: "true"
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      # CI-02: mypy is blocking (was `mypy app || true`).
      - run: mypy app
      # CI-02: coverage floor (see [tool.coverage.report] fail_under).
      - run: pytest -q --cov=app --cov-fail-under=75

  frontend:
    name: Frontend (check, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run check
      # CI-03: lint is part of the gate.
      - run: npm run lint
      - run: npm run test -- --run
      # CI-02/CI-03: frontend coverage with a floor.
      - run: npm run test:coverage
      - run: npm run build

  e2e:
    name: E2E (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack and seed
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis minio
          # Migrate + seed demo/bulk data so e2e has accounts and content.
          make db-migrate
          make db-seed
          docker compose up -d --build backend frontend
      - name: Wait for the backend to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/api/v1/health/ready >/dev/null 2>&1; then
              echo "backend ready"; break
            fi
            sleep 2
          done
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - name: Install frontend deps + browsers
        working-directory: apps/frontend
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: apps/frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/frontend/test-results/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  contracts:
    name: Contracts (compile, tests, coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blockchain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blockchain/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npx hardhat compile
      - run: npx hardhat test
      # WEB3-13: contract coverage must run and report.
      - run: npx hardhat coverage
