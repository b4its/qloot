[project]
name = "qloot-backend"
version = "0.1.0"
description = "QLoot backend — gamified learning on Web3 + AI (FastAPI)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "redis>=5.2.0",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "argon2-cffi>=23.1.0",
    "structlog>=24.4.0",
    "web3>=7.4.0",
    "eth-account>=0.13.3",
    "python-dotenv>=1.0.1",
    "pypdf>=5.1.0",
    "minio>=7.2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.2",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "bandit>=1.7.10",
    "types-redis",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "ASYNC"]
ignore = ["B008", "SIM108", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: tests that require a live database",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::sqlalchemy.exc.SAWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# CI-02: coverage ratchet floor. Set below the current base (~80%) so it holds
# the line without blocking unrelated work; raise it as coverage grows.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
