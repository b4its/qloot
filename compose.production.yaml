# ============================================================================
# QLoot — production overlay
#   docker compose -f compose.yaml -f compose.production.yaml up -d
# Secrets come from the environment / docker secrets, never from this file.
# ============================================================================

name: qloot

services:
  backend:
    restart: always
    environment:
      APP_ENV: production
      SESSION_SECURE: "true"
      DEBUG: "false"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g

  worker:
    restart: always
    environment:
      APP_ENV: production
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  blockchain-worker:
    restart: always
    environment:
      APP_ENV: production
      # In production the chain must be real.
      BLOCKCHAIN_DRY_RUN: "false"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  blockchain-indexer:
    restart: always
    environment:
      APP_ENV: production
      BLOCKCHAIN_DRY_RUN: "false"

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384m

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  redis:
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
