# Traefik dynamic configuration for QLoot.
http:
  middlewares:
    security-headers:
      headers:
        stsSeconds: 63072000
        stsIncludeSubdomains: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        customResponseHeaders:
          X-XSS-Protection: "0"
    compress:
      compress: {}
    rate-limit:
      rateLimit:
        average: 100
        burst: 50

  routers:
    frontend:
      rule: "Host(`qloot.localhost`)"
      service: frontend
      entryPoints: [web]
      middlewares: [security-headers, compress]
    backend:
      rule: "Host(`qloot.localhost`) && PathPrefix(`/api`)"
      service: backend
      entryPoints: [web]
      middlewares: [security-headers, compress, rate-limit]

  services:
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:3000"
    backend:
      loadBalancer:
        servers:
          - url: "http://backend:8000"
